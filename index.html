<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RONBO — Peace • Balance • Wellness | Paz • Equilibrio • Bienestar</title>
  <meta name="description" content="RONBO — Peace • Balance • Wellness. Coming soon. | Paz • Equilibrio • Bienestar. Próximamente." />
  <link rel="icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --forest: #0d3b2e;
      --forest-deep: #082a21;
      --cream: #f5f1e8;
      --gold: #c9a96a;
      --sage: #9db8a4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 800px at 50% 20%, #12503f 0%, var(--forest) 55%, var(--forest-deep) 100%);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card { max-width: 640px; animation: rise 1.2s ease-out both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: min(400px, 76vw);
      height: auto;
      display: block;
      margin: 0 auto 1.4rem;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.45));
    }
    .tagline {
      font-weight: 300;
      letter-spacing: .28em;
      text-indent: .28em;
      text-transform: uppercase;
      font-size: clamp(.7rem, 2.4vw, .95rem);
      color: var(--gold);
      margin-bottom: 2rem;
    }
    .rule {
      width: 72px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 2rem;
    }
    .soon {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.4rem, 4.5vw, 2rem);
      margin-bottom: .5rem;
    }
    .soon-es {
      font-weight: 300;
      letter-spacing: .18em;
      text-indent: .18em;
      text-transform: uppercase;
      font-size: .8rem;
      color: var(--sage);
      margin-bottom: 2.25rem;
    }
    .socials {
      margin-top: .5rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .8rem;
      margin-bottom: 2.5rem;
    }
    .social-link {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .7rem 1.25rem;
      border: 1px solid rgba(201,169,106,.45);
      border-radius: 999px;
      color: var(--cream);
      text-decoration: none;
      font-weight: 400;
      font-size: .85rem;
      letter-spacing: .06em;
      transition: border-color .25s, background .25s, transform .25s;
    }
    .social-link:hover {
      border-color: var(--gold);
      background: rgba(201,169,106,.12);
      transform: translateY(-1px);
    }
    .social-link .handle { color: var(--gold); font-weight: 500; }
    .social-link .arrow { font-size: .75rem; opacity: .7; }
    footer {
      font-size: .75rem;
      font-weight: 300;
      letter-spacing: .12em;
      color: rgba(245, 241, 232, .55);
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="ronbo-logo.webp" alt="Ronbo — Peace, Balance, Wellness" />
    <p class="tagline">Peace • Balance • Wellness</p>
    <div class="rule"></div>
    <div class="socials">
      <a class="social-link" href="https://www.tiktok.com/@ronbo.store" target="_blank" rel="noopener">TikTok <span class="handle">@ronbo.store</span> <span class="arrow">↗</span></a>
      <a class="social-link" href="https://www.instagram.com/ronbo.store" target="_blank" rel="noopener">Instagram <span class="handle">@ronbo.store</span> <span class="arrow">↗</span></a>
    </div>
    <footer>© 2026 RONBO — ronbo.store</footer>
  </main>
</body>
</html>
